<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .heading { animation: slidein 9s ease-out infinite; }
    .underline { animation: bar 9s ease-out infinite; transform-origin: left center; }
    .meta { animation: fade 9s ease-in-out infinite; }
    .corner { animation: cornerSlide 9s ease-out infinite; }
    .stat { animation: fadeUp 9s ease-out infinite; }
    .s0 { animation-delay: 0.3s }
    .s1 { animation-delay: 0.4s }
    .s2 { animation-delay: 0.5s }
    .s3 { animation-delay: 0.6000000000000001s }
    .lang-bar { animation: bar 9s ease-out infinite; transform-origin: left center; }

    @keyframes slidein {
      0% { opacity: 0; transform: translateX(-12px) }
      8% { opacity: 1; transform: translateX(0) }
      90% { opacity: 1; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
    @keyframes bar {
      0%, 14% { transform: scaleX(0) }
      24%, 88% { transform: scaleX(1) }
      100% { transform: scaleX(1) }
    }
    @keyframes fade {
      0%, 22% { opacity: 0 }
      32%, 90% { opacity: 1 }
      100% { opacity: 0 }
    }
    @keyframes fadeUp {
      0%, 22% { opacity: 0; transform: translateY(8px) }
      36%, 90% { opacity: 1; transform: translateY(0) }
      100% { opacity: 0; transform: translateY(0) }
    }
    @keyframes cornerSlide {
      0%, 8% { opacity: 0; transform: translateX(-8px) }
      18%, 90% { opacity: 0.6; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
  </style>
  <defs>
    <linearGradient id="sleek-stats-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sleek-stats-bg)" rx="14" ry="14"/>

  <!-- corner decorations (mirrors sleek-header) -->
  <g class="corner" opacity="0.6">
    <rect x="40" y="42" width="22" height="2" fill="#f01611"/>
    <rect x="40" y="42" width="2" height="22" fill="#f01611"/>
  </g>
  <g transform="translate(800 0) scale(-1 1)">
    <g class="corner" opacity="0.6">
      <rect x="40" y="42" width="22" height="2" fill="#f01611"/>
      <rect x="40" y="42" width="2" height="22" fill="#f01611"/>
    </g>
  </g>

  <!-- heading + accent underline -->
  <text class="heading" x="48" y="84" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="36" font-weight="700" letter-spacing="-1.2">Activity.</text>
  <rect class="underline" x="48" y="96" width="181" height="2" fill="#f01611" rx="1"/>

  <!-- meta line -->
  <text class="meta" x="48" y="120" fill="#bc7970" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">@SHAHMEERNASEER   ·   90 CONTRIBUTIONS   ·   GRAPHQL</text>

  <!-- stat blocks -->
  <g transform="translate(48 156)">
      <g class="stat s0">
        <text x="0" y="0" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REPOS</text>
        <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">33</text>
        <text x="0" y="60" fill="#bc7970" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">33 indexed</text>
      </g>
    </g>
  <g transform="translate(230 156)">
      <g class="stat s1">
        <text x="0" y="0" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">COMMITS</text>
        <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">56</text>
        <text x="0" y="60" fill="#bc7970" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
      </g>
    </g>
  <g transform="translate(412 156)">
      <g class="stat s2">
        <text x="0" y="0" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PRS</text>
        <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">0</text>
        <text x="0" y="60" fill="#bc7970" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">0 this year</text>
      </g>
    </g>
  <g transform="translate(594 156)">
      <g class="stat s3">
        <text x="0" y="0" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">REVIEWS</text>
        <text x="0" y="38" fill="#ffffff" font-family='"Inter", system-ui, sans-serif' font-size="34" font-weight="700" letter-spacing="-1">0</text>
        <text x="0" y="60" fill="#bc7970" font-family='"Inter", system-ui, sans-serif' font-size="11" font-weight="400">this year</text>
      </g>
    </g>

  <!-- language strip -->
  <rect x="48" y="254" width="704" height="6" rx="3" fill="#bc7970" fill-opacity="0.2"/>
  <g class="lang-bar"><rect x="48" y="254" width="272.44800000000004" height="6" rx="3" fill="#f1e05a"/>
  <rect x="320.44800000000004" y="254" width="240.76800000000003" height="6" rx="3" fill="#e34c26"/>
  <rect x="561.2160000000001" y="254" width="135.168" height="6" rx="3" fill="#663399"/>
  <rect x="696.3840000000001" y="254" width="55.61599999999987" height="6" rx="3" fill="#3178c6"/></g>
  <g>
        <rect x="48" y="279" width="8" height="8" rx="2" fill="#f1e05a"/>
        <text x="64" y="286" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">JAVASCRIPT  39%</text>
      </g>
  <g>
        <rect x="224" y="279" width="8" height="8" rx="2" fill="#e34c26"/>
        <text x="240" y="286" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">HTML  34%</text>
      </g>
  <g>
        <rect x="400" y="279" width="8" height="8" rx="2" fill="#663399"/>
        <text x="416" y="286" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">CSS  19%</text>
      </g>
  <g>
        <rect x="576" y="279" width="8" height="8" rx="2" fill="#3178c6"/>
        <text x="592" y="286" fill="#bc7970" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">TYPESCRIPT  8%</text>
      </g>
</svg>